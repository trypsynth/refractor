# Native code reaches all of these through JNI by name, which R8 cannot see, so an app that
# shrinks its code would otherwise lose them. prism's own archive brings no rules for its classes.
-keep class com.trypsynth.refractor.PrismLoader { *; }
-keep class com.github.ethindp.prism.** { *; }
-keep class com.snapchat.djinni.** { *; }
-keep class com.dropbox.djinni.** { *; }
