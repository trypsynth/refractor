name: Docs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only the newest push's site matters, but a deployment already under way is left to finish.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # DocFX reads the API from the project, which builds without prism itself.
      - name: Build the site
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  # A pull request only checks that the site builds.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
