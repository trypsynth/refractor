name: CI

on:
  push:
    branches: [master, verify/prism-fixes]
    tags: ["v*"]
  pull_request:

jobs:
  # MSVC links libraries from an older toolset but not a newer one, so prism is built with the
  # oldest Visual Studio a consumer is likely to publish with.
  native:
    strategy:
      matrix:
        include:
          - runtime: win-x64
            os: windows-2022
          - runtime: win-arm64
            os: windows-2022
          - runtime: win-x86
            os: windows-2022
          - runtime: osx-arm64
            os: macos-latest
          - runtime: osx-x64
            os: macos-15-intel
          - runtime: ios-arm64
            os: macos-26
          - runtime: iossimulator-arm64
            os: macos-26
          - runtime: iossimulator-x64
            os: macos-26
          - runtime: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Find the prism commit
        id: prism
        shell: pwsh
        run: echo "commit=$(git -C native/prism rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Cache prism
        id: prism-cache
        uses: actions/cache@v4
        with:
          path: artifacts/native/${{ matrix.runtime }}
          key: prism-${{ matrix.os }}-${{ matrix.runtime }}-${{ steps.prism.outputs.commit }}-${{ hashFiles('scripts/build-native.ps1') }}

      # prism asks for C23, which older CMake cannot map to an MSVC flag.
      - uses: lukka/get-cmake@latest
        if: steps.prism-cache.outputs.cache-hit != 'true'

      # prism's Gradle build asks for a Java 25 toolchain.
      - uses: actions/setup-java@v4
        if: matrix.runtime == 'android' && steps.prism-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 25

      - name: Build prism
        if: steps.prism-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-native.ps1 -Runtimes ${{ matrix.runtime }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.runtime }}
          path: artifacts/native/${{ matrix.runtime }}

  static-registration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - name: Install Speech Dispatcher
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev

      - name: Build prism statically
        run: |
          cmake -S native/prism -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --parallel
          cmake --install build

      - name: Link without loading the archive whole
        run: |
          cc -c scripts/verify/count.c -I install/include -o count.o
          if [ "$RUNNER_OS" = "Linux" ]; then
            c++ count.o install/lib/libprism.a $(pkg-config --libs gio-2.0) -ldl -lpthread -o count
          else
            c++ count.o install/lib/libprism.a -framework Foundation -framework AVFoundation -framework AppKit -framework IOKit -framework CoreFoundation -o count
          fi
          ./count | tee out.txt
          grep -q "registered backends: [1-9]" out.txt

  speechd-at-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - name: Install Speech Dispatcher and GLib headers
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libglib2.0-dev

      - name: Build prism
        run: |
          cmake -S native/prism -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$PWD/install" | tee configure.log
          grep -q "orca=on" configure.log
          cmake --build build --parallel
          cmake --install build
          cc scripts/verify/speechd.c -I install/include -L install/lib -lprism -Wl,-rpath,"$PWD/install/lib" -o speechd
          cc scripts/verify/orca.c -I install/include -L install/lib -lprism -Wl,-rpath,"$PWD/install/lib" -o orca

      - name: libprism links none of libspeechd, glibmm, giomm or sigc++
        run: |
          ldd install/lib/libprism.so
          if ldd install/lib/libprism.so | grep -qE "speechd|glibmm|giomm|sigc"; then exit 1; fi

      - name: Orca through GIO, and power management
        run: PRISM_LOG=debug ./orca

      - name: Without libspeechd
        run: |
          sudo apt-get remove -y libspeechd-dev libspeechd2
          PRISM_LOG=debug ./speechd missing

      - name: With Speech Dispatcher
        run: |
          sudo apt-get install -y speech-dispatcher speech-dispatcher-espeak-ng
          ./speechd

  spiel-at-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gobject-introspection libgirepository1.0-dev dbus

      - name: Build libspeechprovider and libspiel at prism's pinned commits
        run: |
          build() {
            git clone -q "https://github.com/project-spiel/$1"
            git -C "$1" checkout -q "$2"
            local name="$1"
            shift 2
            meson setup "$name/build" "$name" --prefix=/usr/local "$@"
            meson compile -C "$name/build"
            sudo meson install -C "$name/build"
          }
          build libspeechprovider 07e6a2a4f1df7149966588e57daf43336eba28ed -Dtests=false -Ddocs=false -Drust-bindings=false
          build libspiel adceb561f10cd0db335503b95273177b1a2b73b5 -Dtests=false -Ddocs=false -Dutils=false
          sudo ldconfig
          readelf -d $(find /usr/local/lib -name 'libspiel-1.0.so.*' | head -1) | grep SONAME

      - name: Build prism
        run: |
          export PKG_CONFIG_PATH=$(dirname $(find /usr/local/lib -name spiel-1.0.pc | head -1))
          cmake -S native/prism -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX="$PWD/install" | tee configure.log
          grep -q "spiel=on" configure.log
          cmake --build build --parallel
          cmake --install build
          cc scripts/verify/backend.c -I install/include -L install/lib -lprism -Wl,-rpath,"$PWD/install/lib" -o backend

      - name: libprism does not link libspiel
        run: |
          ldd install/lib/libprism.so
          if ldd install/lib/libprism.so | grep -q spiel; then exit 1; fi

      - name: With libspiel
        run: PRISM_LOG=debug dbus-run-session -- ./backend Spiel present

      - name: Without libspiel
        run: |
          sudo find /usr/local/lib -name 'libspiel-1.0.so*' -delete
          sudo ldconfig
          PRISM_LOG=debug dbus-run-session -- ./backend Spiel missing

  test:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
            os: windows-latest
            backend: SAPI
          - runtime: win-arm64
            arch: arm64
            os: windows-11-arm
            backend: SAPI
          - runtime: win-x86
            arch: x86
            os: windows-latest
            backend: SAPI
          - runtime: osx-arm64
            arch: arm64
            os: macos-latest
            backend: AVSpeech
          - runtime: osx-x64
            arch: x64
            os: macos-15-intel
            backend: AVSpeech
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The 64 bit SDK runs 32 bit tests through the x86 runtime, which it finds through DOTNET_ROOT_X86.
      - name: Install the x86 runtime
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Channel 10.0 -Runtime dotnet -Architecture x86 -InstallDir "${env:ProgramFiles(x86)}\dotnet"
          echo "DOTNET_ROOT_X86=${env:ProgramFiles(x86)}\dotnet" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.runtime }}
          path: artifacts/native/${{ matrix.runtime }}

      - name: Test
        run: dotnet test tests/Refractor.Tests -c Release --arch ${{ matrix.arch }} -p:RefractorTestRuntime=${{ matrix.runtime }} --blame-crash --logger "console;verbosity=normal"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.runtime }}
          path: tests/Refractor.Tests/TestResults

      # Publishing the sample statically proves the link works, and listing a backend proves the
      # backends survived it.
      - name: Publish with Native AOT
        shell: pwsh
        run: |
          dotnet publish samples/Speak -c Release -r ${{ matrix.runtime }} -o artifacts/sample
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sample = Join-Path artifacts/sample ($IsWindows ? "Speak.exe" : "Speak")
          $output = & $sample --list
          $output
          if (-not ($output -match "${{ matrix.backend }}")) { throw "${{ matrix.backend }} is missing from the statically linked prism." }

  ios:
    needs: native
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install the iOS workload
        run: dotnet workload install ios

      - uses: actions/download-artifact@v4
        with:
          name: native-ios-arm64
          path: artifacts/native/ios-arm64

      - uses: actions/download-artifact@v4
        with:
          name: native-iossimulator-arm64
          path: artifacts/native/iossimulator-arm64

      - name: Link for devices
        run: dotnet build samples/SpeakIos -c Release -r ios-arm64 -p:EnableCodeSigning=false

      - name: Build for the simulator
        run: dotnet build samples/SpeakIos -c Release -r iossimulator-arm64

      - name: Run in the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; print(next(d['udid'] for runtime, found in devices.items() if 'iOS' in runtime for d in found if d['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          app=$(find samples/SpeakIos/bin -type d -name '*.app' -path '*iossimulator-arm64*' | head -1)
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch --console-pty "$udid" com.trypsynth.refractor.speak > ios.log 2>&1 &
          for _ in $(seq 1 90); do
            grep -q "REFRACTOR spoke" ios.log && break
            sleep 1
          done
          cat ios.log
          grep -q "REFRACTOR backend AVSpeech" ios.log
          grep -q "REFRACTOR spoke" ios.log

  android:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - name: Install the Android workload
        run: dotnet workload install android

      - uses: actions/download-artifact@v4
        with:
          name: native-android
          path: artifacts/native/android

      - name: Build
        run: dotnet build samples/SpeakAndroid -c Release -r android-x64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh samples/SpeakAndroid/run-on-emulator.sh

  package:
    needs: [test, ios, android]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/downloads

      - name: Arrange prism
        shell: pwsh
        run: |
          foreach ($artifact in Get-ChildItem artifacts/downloads -Directory) {
            $runtime = $artifact.Name -replace '^native-', ''
            New-Item -ItemType Directory -Force artifacts/native | Out-Null
            Move-Item $artifact.FullName "artifacts/native/$runtime"
          }

      - name: Pack
        run: dotnet pack src/Refractor -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Log in to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget
        uses: NuGet/login@v1
        with:
          user: trypsynth

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          foreach ($package in Get-ChildItem artifacts/packages/*.nupkg) {
            dotnet nuget push $package.FullName --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
