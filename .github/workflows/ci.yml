name: CI

on:
  push:
    branches: [master, verify/prism-fixes]
    tags: ["v*"]
  pull_request:

jobs:
  native:
    strategy:
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest
          - runtime: win-x86
            os: windows-latest
          - runtime: osx-arm64
            os: macos-latest
          - runtime: osx-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Find the prism commit
        id: prism
        shell: pwsh
        run: echo "commit=$(git -C native/prism rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Cache prism
        id: prism-cache
        uses: actions/cache@v4
        with:
          path: artifacts/native/${{ matrix.runtime }}
          key: prism-${{ matrix.runtime }}-${{ steps.prism.outputs.commit }}-${{ hashFiles('scripts/build-native.ps1') }}

      - name: Build prism
        if: steps.prism-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-native.ps1 -Runtimes ${{ matrix.runtime }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.runtime }}
          path: artifacts/native/${{ matrix.runtime }}

  test:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
            os: windows-latest
            backend: SAPI
          - runtime: win-arm64
            arch: arm64
            os: windows-11-arm
            backend: SAPI
          - runtime: win-x86
            arch: x86
            os: windows-latest
            backend: SAPI
          - runtime: osx-arm64
            arch: arm64
            os: macos-latest
            backend: AVSpeech
          - runtime: osx-x64
            arch: x64
            os: macos-15-intel
            backend: AVSpeech
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The 64 bit SDK runs 32 bit tests through the x86 runtime, which it finds through DOTNET_ROOT_X86.
      - name: Install the x86 runtime
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Channel 10.0 -Runtime dotnet -Architecture x86 -InstallDir "${env:ProgramFiles(x86)}\dotnet"
          echo "DOTNET_ROOT_X86=${env:ProgramFiles(x86)}\dotnet" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.runtime }}
          path: artifacts/native/${{ matrix.runtime }}

      - name: Test
        run: dotnet test tests/Refractor.Tests -c Release --arch ${{ matrix.arch }} -p:RefractorTestRuntime=${{ matrix.runtime }} --blame-crash --logger "console;verbosity=normal"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.runtime }}
          path: tests/Refractor.Tests/TestResults

      # Publishing the sample statically proves the link works, and listing a backend proves the
      # backends survived it.
      - name: Publish with Native AOT
        shell: pwsh
        run: |
          dotnet publish samples/Speak -c Release -r ${{ matrix.runtime }} -o artifacts/sample
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sample = Join-Path artifacts/sample ($IsWindows ? "Speak.exe" : "Speak")
          $output = & $sample --list
          $output
          if (-not ($output -match "${{ matrix.backend }}")) { throw "${{ matrix.backend }} is missing from the statically linked prism." }

  package:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/downloads

      - name: Arrange prism
        shell: pwsh
        run: |
          foreach ($artifact in Get-ChildItem artifacts/downloads -Directory) {
            $runtime = $artifact.Name -replace '^native-', ''
            New-Item -ItemType Directory -Force artifacts/native | Out-Null
            Move-Item $artifact.FullName "artifacts/native/$runtime"
          }

      - name: Pack
        run: dotnet pack src/Refractor -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Log in to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget
        uses: NuGet/login@v1
        with:
          user: trypsynth

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          foreach ($package in Get-ChildItem artifacts/packages/*.nupkg) {
            dotnet nuget push $package.FullName --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
