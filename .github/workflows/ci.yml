name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch, pull request or tag makes an older run moot, so only the newest runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MSVC links libraries from an older toolset but not a newer one, so prism is built with the
  # oldest Visual Studio a consumer is likely to publish with.
  native:
    strategy:
      matrix:
        include:
          - runtime: win-x64
            os: windows-2022
          - runtime: win-arm64
            os: windows-2022
          - runtime: win-x86
            os: windows-2022
          - runtime: osx-arm64
            os: macos-latest
          - runtime: osx-x64
            os: macos-15-intel
          - runtime: ios-arm64
            os: macos-26
          - runtime: iossimulator-arm64
            os: macos-26
          - runtime: iossimulator-x64
            os: macos-26
          # The oldest Ubuntu runner, so the shared prism needs nothing newer than its glibc.
          - runtime: linux-x64
            os: ubuntu-22.04
          - runtime: linux-arm64
            os: ubuntu-22.04-arm
          # One library archive holds every Android ABI.
          - runtime: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Find the prism commit
        id: prism
        shell: pwsh
        run: echo "commit=$(git -C native/prism rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Cache prism
        id: prism-cache
        uses: actions/cache@v4
        with:
          path: artifacts/native/${{ matrix.runtime }}
          key: prism-${{ matrix.os }}-${{ matrix.runtime }}-${{ steps.prism.outputs.commit }}-${{ hashFiles('scripts/build-native.ps1') }}

      # prism asks for C23, which older CMake cannot map to an MSVC flag.
      - uses: lukka/get-cmake@latest
        if: steps.prism-cache.outputs.cache-hit != 'true'

      # GCC 11, the runner's default, is too old for prism's C++23, so GCC 12 builds it.
      - name: Install prism's Linux dependencies
        if: runner.os == 'Linux' && steps.prism-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 libdbus-1-dev libspeechd-dev libxcb1-dev libwayland-dev
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV

      # prism's Gradle build asks for a Java 25 toolchain, and fetches the NDK it pins itself.
      - uses: actions/setup-java@v4
        if: matrix.runtime == 'android' && steps.prism-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 25

      - name: Build prism
        if: steps.prism-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-native.ps1 -Runtimes ${{ matrix.runtime }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.runtime }}
          path: artifacts/native/${{ matrix.runtime }}

  test:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
            os: windows-latest
            backend: SAPI
          - runtime: win-arm64
            arch: arm64
            os: windows-11-arm
            backend: SAPI
          - runtime: win-x86
            arch: x86
            os: windows-latest
            backend: SAPI
          - runtime: osx-arm64
            arch: arm64
            os: macos-latest
            backend: AVSpeech
          - runtime: osx-x64
            arch: x64
            os: macos-15-intel
            backend: AVSpeech
          - runtime: linux-x64
            arch: x64
            os: ubuntu-latest
            backend: Speech Dispatcher
          - runtime: linux-arm64
            arch: arm64
            os: ubuntu-24.04-arm
            backend: Speech Dispatcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The 64 bit SDK runs 32 bit tests through the x86 runtime, which it finds through DOTNET_ROOT_X86.
      - name: Install the x86 runtime
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Channel 10.0 -Runtime dotnet -Architecture x86 -InstallDir "${env:ProgramFiles(x86)}\dotnet"
          echo "DOTNET_ROOT_X86=${env:ProgramFiles(x86)}\dotnet" >> $env:GITHUB_ENV

      # Native AOT links with clang, and needs zlib.
      - name: Install the Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.runtime }}
          path: artifacts/native/${{ matrix.runtime }}

      - name: Test
        run: dotnet test tests/Refractor.Tests -c Release --arch ${{ matrix.arch }} -p:RefractorTestRuntime=${{ matrix.runtime }} --blame-crash --logger "console;verbosity=normal"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.runtime }}
          path: tests/Refractor.Tests/TestResults

      # Publishing the sample statically proves the link works, and listing a backend proves the
      # backends survived it.
      - name: Publish with Native AOT
        shell: pwsh
        run: |
          dotnet publish samples/Speak -c Release -r ${{ matrix.runtime }} -o artifacts/sample
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sample = Join-Path artifacts/sample ($IsWindows ? "Speak.exe" : "Speak")
          $output = & $sample --list
          $output
          if (-not ($output -match "${{ matrix.backend }}")) { throw "${{ matrix.backend }} is missing from the statically linked prism." }

  ios:
    needs: native
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The newest .NET for iOS can need an Xcode the runner image does not have yet, so the workload
      # is pinned to a release built for the image's Xcode.
      - name: Install the iOS workload
        run: |
          dotnet workload config --update-mode manifests
          echo '{ "microsoft.net.sdk.ios": "26.5.10318/10.0.100" }' > ios-rollback.json
          dotnet workload install ios --from-rollback-file ios-rollback.json

      - uses: actions/download-artifact@v4
        with:
          name: native-ios-arm64
          path: artifacts/native/ios-arm64

      - uses: actions/download-artifact@v4
        with:
          name: native-iossimulator-arm64
          path: artifacts/native/iossimulator-arm64

      - name: Link for devices
        run: dotnet build samples/SpeakIos -c Release -r ios-arm64 -p:EnableCodeSigning=false

      - name: Build for the simulator
        run: dotnet build samples/SpeakIos -c Release -r iossimulator-arm64

      - name: Run in the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; print(next(d['udid'] for runtime, found in devices.items() if 'iOS' in runtime for d in found if d['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          app=$(find samples/SpeakIos/bin -type d -name '*.app' -path '*iossimulator-arm64*' | head -1)
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch --console-pty "$udid" com.trypsynth.refractor.speak > ios.log 2>&1 &
          for _ in $(seq 1 90); do
            grep -q "REFRACTOR spoke" ios.log && break
            sleep 1
          done
          cat ios.log
          grep -q "REFRACTOR backend AVSpeech" ios.log
          grep -q "REFRACTOR spoke" ios.log

  android:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android workload
        run: dotnet workload install android

      - uses: actions/download-artifact@v4
        with:
          name: native-android
          path: artifacts/native/android

      - name: Build the sample
        run: dotnet build samples/SpeakAndroid -c Release -r android-x64 -p:AndroidPackageFormat=apk -p:RefractorAndroid=true

      # The emulator needs KVM, which the runner has but does not open to its user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install "$(find samples/SpeakAndroid/bin -name '*-Signed.apk' | head -1)"
            adb logcat -c
            adb shell am start -W -n com.trypsynth.refractor.speak/.MainActivity
            for i in $(seq 1 60); do adb logcat -d -s REFRACTOR | grep -q -E "spoke|failed" && break; sleep 1; done
            adb logcat -d -s REFRACTOR
            adb logcat -d -s REFRACTOR | grep -q "backend Android Text to Speech"
            adb logcat -d -s REFRACTOR | grep -q "spoke"

  package:
    needs: [test, ios, android]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/downloads

      - name: Arrange prism
        shell: pwsh
        run: |
          foreach ($artifact in Get-ChildItem artifacts/downloads -Directory) {
            $runtime = $artifact.Name -replace '^native-', ''
            New-Item -ItemType Directory -Force artifacts/native | Out-Null
            Move-Item $artifact.FullName "artifacts/native/$runtime"
          }

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Pack
        run: dotnet pack src/Refractor -c Release -o artifacts/packages -p:RefractorAndroid=true

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Log in to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget
        uses: NuGet/login@v1
        with:
          user: trypsynth

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          foreach ($package in Get-ChildItem artifacts/packages/*.nupkg) {
            dotnet nuget push $package.FullName --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
